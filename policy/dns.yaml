# The only editable source of DNS policy for all three clients.
version: 1
ipv6: true
public_resolvers:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
# Only DNS server names and proxy node names may use these before a tunnel exists.
bootstrap_resolvers:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
# Explicit private namespace exceptions; never use system for public names.
local_resolvers:
  lan: system
  local: system
  home.arpa: system
  ts.net: 100.100.100.100
fake_ip_filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - '*.ts.net'
  - 'time.*.com'
  - 'ntp.*.com'
  - '+.market.xiaomi.com'
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - '+.quickconnect.cn'
  - '+.quickconnect.to'
shadowrocket_hijack:
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1
  - 1.0.0.1
  - 9.9.9.9
  - 208.67.222.222
  - 208.67.220.220
  - 223.5.5.5
  - 223.6.6.6
  - 119.29.29.29
  - 114.114.114.114

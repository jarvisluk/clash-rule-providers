# Generated from jarvisluk/clash-rule-providers rules/classical/*.yaml and policy/routing.yaml.
# Node subscription is configured separately in Shadowrocket.
[General]
update-url = https://raw.githubusercontent.com/jarvisluk/clash-rule-providers/main/shadowrocket/ruleproviders.conf
# Generated from policy/dns.yaml; default DNS uses the selected proxy, DIRECT uses domestic DoH.
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
direct-dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
proxy-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = true
always-ip-address = true
use-local-host-item-for-proxy = true
private-ip-answer = true
udp-policy-not-supported-behaviour = REJECT
ipv6 = true
prefer-ipv6 = false
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,208.67.222.222:53,208.67.220.220:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,114.114.114.114:53
always-real-ip = *.lan,*.local,*.arpa,ts.net,*.ts.net,time.*.com,ntp.*.com,market.xiaomi.com,*.market.xiaomi.com,localhost.ptlogin2.qq.com,msftncsi.com,*.msftncsi.com,msftconnecttest.com,*.msftconnecttest.com,localhost,stun.*.*,*.stun.*.*,stun.*.*.*,*.stun.*.*.*


name: Sync client configurations

on:
  push:
    branches: [main]
    paths:
      - 'rules/classical/**'
      - 'scripts/build_shadowrocket.py'
      - 'scripts/validate.py'
      - 'scripts/dns_policy.py'
      - 'scripts/build_dns.py'
      - 'policy/**'
      - 'tests/**'
      - '.github/workflows/sync-shadowrocket.yml'
  pull_request:
    paths:
      - 'rules/classical/**'
      - 'scripts/build_shadowrocket.py'
      - 'scripts/validate.py'
      - 'scripts/dns_policy.py'
      - 'scripts/build_dns.py'
      - 'policy/**'
      - 'tests/**'
      - '.github/workflows/sync-shadowrocket.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowrocket-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/validate.py
      - run: python scripts/build_shadowrocket.py
      - run: python scripts/build_dns.py
      - run: python -m unittest discover -s tests
      - run: node tests/dns_override.test.js

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Generate and publish current client configurations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/validate.py
            python scripts/build_shadowrocket.py
            python scripts/build_dns.py
            python -m unittest discover -s tests
            node tests/dns_override.test.js
            git add shadowrocket/ruleproviders.conf mihomo/dns.yaml mihomo/dns-override.js flclash/dns-override.js
            if git diff --cached --quiet; then
              echo 'Client configurations are already current.'
              exit 0
            fi
            git commit -m 'chore(config): sync generated client configurations'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Failed to publish after three attempts.' >&2
          exit 1
